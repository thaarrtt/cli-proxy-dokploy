services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    container_name: cli-proxy-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEPLOY: "docker"
    volumes:
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      - cli-proxy-auths:/CLIProxyAPI/auths
    ports:
      - "${API_PORT:-8317}:8317"

volumes:
  cli-proxy-auths:
